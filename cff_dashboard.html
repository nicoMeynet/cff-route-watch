<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CFF Route Watch</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#eb0000">
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1c1f24; --muted: #6b7280; --line: #e5e7eb;
    --ok: #15803d; --ok-bg: #dcfce7;
    --warn: #b45309; --warn-bg: #fef3c7;
    --bad: #b91c1c; --bad-bg: #fee2e2;
    --accent: #eb0000; --pin: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111317; --card: #1b1e24; --text: #e8eaed; --muted: #9aa0a6; --line: #2c3038;
      --ok: #4ade80; --ok-bg: #12301f;
      --warn: #fbbf24; --warn-bg: #3a2c0d;
      --bad: #f87171; --bad-bg: #3b1515;
      --pin: #60a5fa;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 20px 16px 60px; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  header h1 { font-size: 20px; margin: 0; display: flex; align-items: center; gap: 8px; }
  header h1 .logo { background: var(--accent); color: #fff; border-radius: 6px; padding: 2px 7px; font-size: 13px; letter-spacing: .5px; }
  .route { color: var(--muted); }
  .spacer { flex: 1; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.on { background: var(--pin); color: #fff; border-color: var(--pin); }
  .status-line { font-size: 13px; color: var(--muted); }
  .status-line .err { color: var(--bad); }
  /* the direction: shown once, with a button to swap it */
  .dir { display: flex; align-items: center; gap: 4px; padding: 4px; margin-bottom: 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  .dir .dirroute { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 9px 14px; border-radius: 9px;
    background: var(--accent); color: #fff; font-weight: 700; font-size: 16px; }
  .dir .dirwhen { flex: none; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    background: rgba(255,255,255,.22); border-radius: 6px; padding: 2px 7px; }
  .dir #dirRoute { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dir button { flex: none; border: 0; border-radius: 9px; padding: 10px 14px; font-weight: 600; font-size: 15px;
    background: transparent; color: var(--muted); white-space: nowrap; }
  .dir button:hover { color: var(--text); background: color-mix(in srgb, var(--line) 50%, transparent); }

  .hero { border-radius: 14px; padding: 22px 24px; margin-bottom: 16px; background: var(--card);
    border: 2px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 8px 20px; align-items: center; }
  .hero.ok { border-color: var(--ok); }
  .hero.warn { border-color: var(--warn); background: var(--warn-bg); }
  .hero.bad { border-color: var(--bad); background: var(--bad-bg); }
  .hero .kicker { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .hero .times { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 10px; }
  .hero .times .tm { white-space: nowrap; }
  .hero .times b { font-weight: 700; }
  .hero .times s { color: var(--muted); font-weight: 400; font-size: 24px; margin-right: 6px; }
  .hero .meta { color: var(--muted); }
  .hero .why { margin-top: 6px; font-weight: 500; }
  .hero.warn .why { color: var(--warn); } .hero.bad .why { color: var(--bad); }
  .hero .big { font-size: 28px; font-weight: 800; text-align: right; }
  .hero.ok .big { color: var(--ok); } .hero.warn .big { color: var(--warn); } .hero.bad .big { color: var(--bad); }
  .hero .countdown { text-align: right; color: var(--muted); }
  .hero .remain { grid-column: 1 / -1; margin-top: 4px; padding: 12px 14px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); }
  .hero .rline { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-top: 2px; }
  .hero .rbig { font-size: 32px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--text); }
  .hero .rinfo { color: var(--muted); }
  .hero .rbar { height: 6px; border-radius: 3px; background: var(--line); margin-top: 8px; overflow: hidden; }
  .hero .rbar i { display: block; height: 100%; background: var(--ok); border-radius: 3px; }
  .hero.warn .rbar i { background: var(--warn); } .hero.bad .rbar i { background: var(--bad); }
  .hero .alt { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    margin-top: 6px; padding: 12px 14px; border-radius: 10px; background: var(--card); border: 2px solid var(--ok); }
  .hero .alt b { font-size: 17px; }
  .hero .alt button { background: var(--ok); color: var(--card); border-color: var(--ok); font-weight: 600; }
  .hero .alt.none { border: 1px dashed var(--line); color: var(--muted); }

  .alerts { margin-bottom: 16px; display: grid; gap: 8px; }
  .alert { border-radius: 10px; padding: 10px 14px; font-weight: 500; }
  .alert.bad { background: var(--bad-bg); color: var(--bad); }
  .alert.warn { background: var(--warn-bg); color: var(--warn); }
  .alert.info { background: var(--card); color: var(--muted); border: 1px dashed var(--line); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 22px 120px 1fr auto; gap: 12px; align-items: center;
    padding: 12px 16px; border-top: 1px solid var(--line); cursor: pointer; }
  .row:first-child { border-top: 0; }
  .row:hover { background: color-mix(in srgb, var(--line) 35%, transparent); }
  .row.past { opacity: .45; }
  .row.gone .t, .row.gone .sub { text-decoration: line-through; }
  .row .pin { color: var(--muted); font-size: 16px; text-align: center; }
  /* the trip as a line: one dot per stop, coloured by what goes on there */
  .track { grid-column: 2 / -1; position: relative; height: 16px; margin: -4px 6px 0; }
  .track .seg { position: absolute; top: 7px; height: 3px; border-radius: 2px; background: var(--ok); }
  .track .seg.warn { background: var(--warn); } .track .seg.bad { background: var(--bad); }
  .track .seg.off { background: var(--line); }
  .track .seg.wait { background: var(--line); height: 2px; top: 7.5px; }
  .track .seg.wait.long { background: var(--warn); }
  .track .seg.walk.long { background: repeating-linear-gradient(90deg, var(--warn) 0 3px, transparent 3px 6px); }
  .track .seg.walk { background: repeating-linear-gradient(90deg, var(--muted) 0 3px, transparent 3px 6px); height: 2px; top: 7.5px; }
  .track .dot { position: absolute; top: 4px; width: 9px; height: 9px; margin-left: -4.5px; border-radius: 50%;
    background: var(--card); border: 2px solid var(--ok); }
  .track .dot.big { top: 2px; width: 13px; height: 13px; margin-left: -6.5px; border-width: 3px; }
  .track .dot.warn { border-color: var(--warn); }
  .track .dot.bad { border-color: var(--bad); background: var(--bad); }
  .track .dot.off { border-color: var(--line); }
  .track .tl { position: absolute; inset: 0; pointer-events: none; }
  .track .tl.todo { opacity: .35; }
  /* the train: a white dot ringed with the trip colour, with a soft pulsing halo */
  .track .now { position: absolute; z-index: 2; top: 3px; width: 11px; height: 11px; margin-left: -5.5px; border-radius: 50%;
    background: #fff; border: 2.5px solid currentColor; color: var(--ok); animation: now-pulse 2s ease-out infinite; }
  .track .now.warn { color: var(--warn); } .track .now.bad { color: var(--bad); }
  @keyframes now-pulse {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 60%, transparent); }
    70%, 100% { box-shadow: 0 0 0 8px transparent; }
  }
  @media (prefers-reduced-motion: reduce) { .track .now { animation: none; box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 35%, transparent); } }
  .row.gone .track { text-decoration: none; }
  .track.labelled { height: 30px; } .track.low2 { height: 42px; }
  .track .slab.low { top: 28px; }
  .track .slab { position: absolute; top: 15px; transform: translateX(-50%); font-size: 11px; line-height: 1; white-space: nowrap;
    color: var(--muted); font-weight: 600; cursor: default; }
  .track .slab.warn { color: var(--warn); } .track .slab.bad { color: var(--bad); }
  .hero .hero-track.labelled { height: 36px; } .hero .hero-track.low2 { height: 50px; }
  .hero .hero-track .slab.low { top: 34px; }
  .hero .hero-track .slab { top: 20px; font-size: 12px; }
  .tlegend-wrap { grid-column: 1 / -1; margin: -4px 8px 0; font-size: 11px; color: var(--muted); }
  .tlegend-wrap summary { cursor: pointer; width: max-content; }
  @media (min-width: 561px) { .tlegend-wrap[open] summary { display: none; } }
  .tlegend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 4px 0 0; font-size: 11px; color: var(--muted); }
  .tlegend span { display: inline-flex; align-items: center; gap: 4px; }
  .tlegend .lg-train { display: inline-block; width: 16px; height: 4px; border-radius: 2px; background: var(--muted); }
  .tlegend .lg-train.ok { background: var(--ok); } .tlegend .lg-train.warn { background: var(--warn); }
  .tlegend .lg-train.bad { background: var(--bad); } .tlegend .lg-train.off { background: var(--line); }
  .tlegend .lg-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--muted); }
  .hero .hero-track { grid-column: 1 / -1; height: 20px; margin: 2px 8px 0; }
  .hero .hero-track .seg { top: 8px; height: 5px; border-radius: 3px; }
  .hero .hero-track .seg.wait, .hero .hero-track .seg.walk { top: 9.5px; height: 2px; }
  .hero .hero-track .dot.big { top: 2px; width: 16px; height: 16px; margin-left: -8px; }
  .hero .hero-track .now { top: 3.5px; width: 14px; height: 14px; margin-left: -7px; border-width: 3px; }
  .row.pinned .pin { color: var(--pin); }
  .row.pinned { box-shadow: inset 4px 0 0 var(--pin); }
  .t { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 17px; }
  .t .rt { display: block; font-size: 13px; font-weight: 500; }
  .sub { color: var(--muted); font-size: 13px; }
  .prod { display: inline-block; border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; margin-right: 4px; font-size: 12px; font-weight: 600; color: var(--text); }
  .chipwrap { display: inline-flex; align-items: center; gap: 4px; justify-self: end; }
  .quip-btn { border: 0; background: none; padding: 0 2px; color: var(--muted); font-size: 15px; line-height: 1; cursor: pointer; }
  .quip-btn:hover { color: var(--pin); border: 0; }
  .hero .big .quip-btn { font-size: 18px; vertical-align: middle; }
  .quip { position: fixed; z-index: 50; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font-size: 13px; font-style: italic; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
  .quip[hidden] { display: none; }
  .quip::before { content: "⚛️ "; font-style: normal; }
  .chip { border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .prod.warn { border-color: var(--warn); color: var(--warn); }
  .prod.bad { border-color: var(--bad); color: var(--bad); background: var(--bad-bg); }
  .prod.off { color: var(--muted); text-decoration: line-through; }
  .hero .legs { grid-column: 1 / -1; list-style: none; margin: 0; padding: 8px 12px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--card); color: var(--text); font-size: 13px; }
  .legs .ltitle { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 2px; }
  .legs .leg { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; }
  .legs .licon { width: 18px; text-align: center; flex: none; }
  .legs .lname { flex: 1; min-width: 0; }
  .legs .lstate { font-weight: 600; white-space: nowrap; }
  .legs .leg.ok .lstate { color: var(--ok); } .legs .leg.warn .lstate { color: var(--warn); }
  .legs .leg.bad .lstate { color: var(--bad); }
  .legs .leg.bad .lname b { color: var(--bad); }
  .legs .leg.off { color: var(--muted); } .legs .leg.off .lname { text-decoration: line-through; }
  .legs .lchg { padding: 0 0 0 26px; font-size: 12px; color: var(--muted); }
  .legs .lchg.long { color: var(--warn); }
  .legs .lchg.missed { color: var(--bad); font-weight: 600; } .legs .lchg.risk { color: var(--warn); font-weight: 600; }
  .chip.ok { background: var(--ok-bg); color: var(--ok); }
  .chip.warn { background: var(--warn-bg); color: var(--warn); }
  .chip.bad { background: var(--bad-bg); color: var(--bad); }
  .late { color: var(--warn); } .vlate { color: var(--bad); }
  .empty { padding: 30px; text-align: center; color: var(--muted); }
  .io { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px; margin-top: 14px; }
  .keyfield { grid-column: 1 / -1; }
  .keyrow { display: flex; gap: 8px; } .keyrow input { flex: 1; min-width: 0; }
  .sbbmsg { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 13px; }
  .sbbmsg li { color: var(--text); } .sbbmsg li b { color: var(--pin); }
  .sbb-ico { margin-left: 6px; cursor: help; }
  .linkfield { flex: 1 1 320px; } .linkfield input { width: 100%; font-size: 13px; }
  .field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  .search { position: relative; display: block; }
  .search input { width: 100%; }
  .suggest { position: absolute; left: 0; min-width: max(100%, 280px); max-width: calc(100vw - 32px); top: calc(100% + 4px); z-index: 20; list-style: none; margin: 0; padding: 4px;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.2); max-height: 300px; overflow: auto; }
  .suggest li { display: flex; gap: 8px; align-items: center; padding: 7px 8px; border-radius: 6px; cursor: pointer; color: var(--text); font-size: 14px; }
  .suggest li.on, .suggest li:hover { background: color-mix(in srgb, var(--pin) 18%, transparent); }
  .suggest li.none { color: var(--muted); cursor: default; background: none; }
  .io-msg { font-size: 13px; color: var(--ok); }
  .io-msg.err { color: var(--bad); }
  .long { color: var(--warn); font-weight: 600; white-space: nowrap; }
  .long.vlong { color: var(--bad); }
  details.stops { grid-column: 1 / -1; margin-top: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  details.stops summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--muted); }
  details.stops summary b { color: var(--text); }
  details.stops ol { list-style: none; margin: 10px 0 4px; padding: 0; }
  .stop { display: grid; grid-template-columns: 26px 1fr auto 64px; gap: 8px; align-items: center; min-height: 26px; position: relative; font-size: 14px; font-variant-numeric: tabular-nums; }
  .stop .dot { justify-self: center; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--muted); background: var(--card); z-index: 1; display: grid; place-items: center; font-size: 15px; }
  .stop::before { content: ""; position: absolute; left: 12px; top: 0; bottom: 0; width: 2px; background: var(--line); }
  .stop:first-child::before { top: 50%; } .stop:last-child::before { bottom: 50%; }
  .stop.end .sname { font-weight: 700; }
  .stop.passed { color: var(--muted); }
  .stop.passed .dot { background: var(--muted); }
  .stop.here .dot, .stop.moving .dot { width: 24px; height: 24px; border: 0; background: transparent; }
  /* the train in the stops list: the same glowing dot as on the trip line */
  .now-dot { display: block; width: 13px; height: 13px; border-radius: 50%; background: #fff; border: 3px solid currentColor;
    color: var(--ok); animation: now-pulse 2s ease-out infinite; }
  .hero.warn .now-dot { color: var(--warn); } .hero.bad .now-dot { color: var(--bad); }
  @media (prefers-reduced-motion: reduce) { .now-dot { animation: none; } }
  .hero.warn .stop .bar i { background: var(--warn); } .hero.bad .stop .bar i { background: var(--bad); }
  .stop.here .sname { font-weight: 700; }
  .stop .stime { text-align: right; } .stop .stime .ad { white-space: nowrap; color: var(--muted); font-size: 13px; }
  .stop .stime .ad b, .stop .stime .ad span[title] { color: var(--text); font-size: 14px; } .stop .stime .ad b.late { color: var(--warn); } .stop .stime .ad b.vlate { color: var(--bad); }
  .stop .plus { font-size: 12px; font-weight: 700; } .stop .stime .sep { color: var(--muted); } .stop .splat { color: var(--muted); font-size: 12px; text-align: right; }
  .stop.earlier button { border: 0; background: none; padding: 0; color: var(--pin); font-size: 13px; font-weight: 600; cursor: pointer; }
  .stop.earlier .dot { border-style: dotted; }
  .stop .chg { font-size: 12px; font-weight: 600; color: var(--pin); margin-left: 4px; }
  .stop .bar { display: block; height: 4px; border-radius: 2px; background: var(--line); max-width: 220px; }
  .stop .bar i { display: block; height: 100%; border-radius: 2px; background: var(--ok); }
  .more { padding: 12px 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .more button { font-size: 13px; padding: 4px 10px; }
  details.onway { border-bottom: 1px solid var(--line); }
  details.onway summary { padding: 12px 16px; cursor: pointer; color: var(--muted); font-size: 14px; font-weight: 600; }
  details.onway summary:hover { color: var(--text); }
  details.onway.warn summary { background: var(--warn-bg); color: var(--warn); }
  details.onway.bad summary { background: var(--bad-bg); color: var(--bad); }
  details.onway[open] summary { border-bottom: 1px solid var(--line); }
  details.onway .row:first-of-type { border-top: 0; }

  /* occupancy: 3 little bars per class */
  .occ { display: inline-flex; align-items: center; gap: 3px; margin-left: 8px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .occ .bars { display: inline-flex; gap: 1px; align-items: flex-end; }
  .occ .bars i { width: 4px; background: var(--line); border-radius: 1px; }
  .occ .bars i:nth-child(1) { height: 6px; } .occ .bars i:nth-child(2) { height: 9px; } .occ .bars i:nth-child(3) { height: 12px; }
  .occ.l1 .bars i:nth-child(-n+1) { background: var(--ok); }
  .occ.l2 .bars i:nth-child(-n+2) { background: var(--warn); }
  .occ.l3 .bars i:nth-child(-n+3) { background: var(--bad); }

  /* settings: a panel from the right on a computer, a full screen sheet from the bottom on a phone */
  .gear { padding: 6px 10px; line-height: 0; color: var(--text); }
  #refreshBtn .btxt { margin-left: 5px; }
  .sp-back { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.45); }
  .sp { position: fixed; z-index: 41; top: 0; right: 0; bottom: 0; width: min(460px, 100%); display: flex; flex-direction: column;
    background: var(--bg); border-left: 1px solid var(--line); box-shadow: -8px 0 30px rgba(0,0,0,.25);
    transform: translateX(100%); transition: transform .22s ease; }
  .sp.open { transform: none; }
  .sp-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px;
    padding-top: max(12px, env(safe-area-inset-top)); background: var(--card); border-bottom: 1px solid var(--line); }
  .sp-head h2 { margin: 0; font-size: 18px; }
  .sp-close { font-size: 16px; padding: 6px 12px; }
  .sp-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 14px 16px; padding-bottom: max(28px, env(safe-area-inset-bottom)); }
  .sp section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
  .sp h3 { margin: 0; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .sp section > h3 + * { margin-top: 6px; }
  .srow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
  .sp h3 + .srow, .sp .alertfield + .srow { border-top: 0; }
  .srow.stack { flex-direction: column; align-items: stretch; gap: 6px; }
  .srow .sl { display: flex; flex-direction: column; min-width: 0; }
  .srow .sl b { font-weight: 600; font-size: 14px; color: var(--text); }
  .srow .sl small { color: var(--muted); font-size: 12px; line-height: 1.35; }
  .srow .sl small:empty { display: none; }
  .srow.off b, .srow.off input { opacity: .5; }
  /* on/off switch (bigger and easier to see than a checkbox) */
  input.switch { appearance: none; -webkit-appearance: none; flex: none; width: 46px; height: 26px; margin: 0; border-radius: 13px;
    background: var(--line); position: relative; cursor: pointer; transition: background .15s; border: 1px solid var(--line); }
  input.switch::before { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .15s; }
  input.switch:checked { background: var(--ok); border-color: var(--ok); }
  .srow .sc input.switch { width: 46px; } /* not stretched like the other fields of a settings row */
  label:has(> input.switch), label:has(.sc > input.switch) { user-select: none; -webkit-user-select: none; }
  input.switch:checked::before { transform: translateX(20px); }
  input.switch:focus-visible { outline: 2px solid var(--pin); outline-offset: 2px; }
  .geo-row .geo-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; color: inherit; font-size: inherit; }
  .geo-box { margin-top: 4px; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--pin) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--pin) 35%, transparent); font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
  .geo-box .geo-state { font-weight: 600; color: var(--text); }
  .geo-box .geo-state.err { color: var(--bad); }
  .geo-box .geo-detail { color: var(--muted); font-size: 12px; white-space: pre-line; }
  .geo-box button { align-self: flex-start; font-size: 13px; padding: 4px 10px; margin-top: 2px; }
  .srow .sc { flex: none; display: inline-flex; align-items: center; gap: 6px; }
  .srow .sc input, .srow .sc select { width: 96px; }
  .srow .sc input[type="time"] { width: 110px; }
  .srow .sc select.wide { width: auto; min-width: 150px; }
  .srow .sc em { font-style: normal; color: var(--muted); font-size: 12px; min-width: 30px; }
  .srow.stack .search input { width: 100%; }
  .sp .alertfield { padding: 4px 0 8px; }
  .sp .keyfield { display: flex; flex-direction: column; gap: 6px; }
  .sp .more-info { margin-top: 8px; font-size: 13px; } .sp .more-info summary { cursor: pointer; color: var(--pin); }
  .sp .io { display: flex; gap: 8px; flex-wrap: wrap; } .sp .io input { flex: 1; min-width: 180px; }
  .sp .hint { margin-top: 10px; }
  body.sp-lock { overflow: hidden; }
  .detect { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 12px; padding: 10px 14px; border-radius: 12px;
    background: color-mix(in srgb, var(--pin) 14%, var(--card)); border: 1px solid color-mix(in srgb, var(--pin) 45%, transparent); font-weight: 600; }
  .detect[hidden] { display: none; }
  .detect .dtxt { flex: 1; min-width: 200px; }
  .detect button { font-size: 14px; padding: 6px 12px; }
  .detect .yes { background: var(--ok); border-color: var(--ok); color: var(--card); }
  .sp-version { text-align: center; color: var(--muted); font-size: 12px; padding: 4px 0 8px; line-height: 1.6; }
  .sp-version a { color: var(--pin); }
  @media (max-width: 560px) {
    .sp { width: 100%; border-left: 0; box-shadow: none; transform: translateY(100%); }
    .sp.open { transform: none; }
  }
  @media (prefers-reduced-motion: reduce) { .sp { transition: none; } }
  .alertfield { grid-column: 1 / -1; }
  .alertfield .check { display: flex; align-items: center; gap: 6px; font-weight: 500; }
  .alertfield .kinds { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 4px 16px; margin: 2px 0 2px 24px; }
  .alertfield .kinds label { display: flex; align-items: center; gap: 6px; font-weight: 400; font-size: 14px; }
  .alertfield .kinds.off { opacity: .5; }
  .alertfield .kinds .crit { font-size: 11px; font-weight: 700; color: var(--bad); text-transform: uppercase; letter-spacing: .03em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-top: 12px; }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  input, select { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .copyright { margin-top: 24px; text-align: center; font-size: 12px; color: var(--muted); }

  @media (max-width: 560px) {
    .hero { grid-template-columns: 1fr; padding: 18px 16px; }
    /* phone header: title, ↻ and ⚙️ on the first line, "Direct only" below */
    header { gap: 8px; }
    header h1 { font-size: 18px; }
    #installBtn { order: 5; }
    /* direction bar: the route may wrap rather than be cut */
    .dir #dirRoute { white-space: normal; overflow: visible; }
    .dir button { padding: 10px 10px; }
    /* stops list: arrival and departure on two lines */
    .stop .stime .ad { display: block; } .stop .stime .sep { display: none; }
    #refreshBtn .btxt { display: none; }
    #refreshBtn, .gear { padding: 6px 11px; }
    /* phone: the scheduled time goes small above the live one, so the times fit on one line */
    .hero .times { font-size: 32px; flex-wrap: nowrap; align-items: flex-end; }
    .hero .times .tm { display: inline-flex; flex-direction: column; line-height: 1.05; }
    .hero .times s { font-size: 15px; margin: 0 0 2px; }
    .hero .big { font-size: 24px; }
    .hero .big, .hero .countdown { text-align: left; }
    /* phone: times and status on the first line, details below, then the trip line */
    .row { grid-template-columns: 18px 1fr auto; grid-template-areas: "pin t chip" ". det det" ". track track"; gap: 4px 10px; }
    .row .pin { grid-area: pin; } .row .t { grid-area: t; white-space: nowrap; }
    .row .det { grid-area: det; } .row .chipwrap { grid-area: chip; justify-self: end; }
    .row .track { grid-area: track; margin-top: 2px; }
  }
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .lang button { border: 0; border-radius: 0; padding: 6px 9px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .lang button + button { border-left: 1px solid var(--line); }
  .lang button[aria-pressed="true"] { background: var(--text); color: var(--card); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="logo" id="logo">CFF</span> <span id="appName">Route Watch</span></h1>
    <span class="spacer"></span>
    <button id="installBtn" hidden></button>
    <button id="refreshBtn"><span aria-hidden="true">↻</span><span class="btxt" data-i18n="refreshTxt"></span></button>
    <button id="settingsBtn" class="gear" type="button" aria-haspopup="dialog" aria-controls="settingsPanel"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </header>
  <div class="dir" id="dirToggle">
    <div class="dirroute"><span class="dirwhen" id="dirWhen"></span><span id="dirRoute"></span></div>
    <button id="dirSwap" type="button" data-dir="out"></button>
  </div>
  <div class="status-line"><span class="route" id="routeLabel"></span> · <span id="statusLine"></span></div>

  <div id="detect" class="detect" role="status" hidden></div>
  <section id="hero" class="hero" style="margin-top:12px"></section>
  <section id="alerts" class="alerts"></section>
  <section class="card" id="list"></section>
  <div class="hint" data-i18n-html="hint"></div>

  <div class="sp-back" id="spBack" hidden></div>
  <aside class="sp" id="settingsPanel" role="dialog" aria-modal="true" aria-labelledby="spTitle" hidden>
    <div class="sp-head">
      <h2 id="spTitle" data-i18n="settings"></h2>
      <button id="spClose" type="button" class="sp-close">✕</button>
    </div>
    <div class="sp-body">
      <section>
        <h3 data-i18n="secGeneral"></h3>
        <div class="srow"><span class="sl"><b data-i18n="langLabel"></b></span>
          <span class="sc"><span class="lang" id="langToggle" role="group" aria-label="Language">
            <button data-lang="en">EN</button><button data-lang="fr">FR</button><button data-lang="de">DE</button><button data-lang="it">IT</button><button data-lang="es">ES</button><button data-lang="ja">JP</button>
          </span></span></div>
        <label class="srow"><span class="sl"><b data-i18n="interval"></b><small data-i18n="h_interval"></small></span><span class="sc"><input id="sInterval" type="number" min="1" max="15" step="1" inputmode="numeric"><em>min</em></span></label>
      </section>
      <section>
        <h3 data-i18n="secRoute"></h3>
        <div class="srow stack"><span class="sl"><b data-i18n="stB"></b><small data-i18n="h_stB"></small></span>
          <span class="search"><input id="sTo" autocomplete="off" spellcheck="false" data-i18n-ph="searchPh"><ul class="suggest" id="sToList" hidden></ul></span></div>
        <div class="srow stack"><span class="sl"><b data-i18n="stA"></b><small data-i18n="h_stA"></small></span>
          <span class="search"><input id="sFrom" autocomplete="off" spellcheck="false" data-i18n-ph="searchPh"><ul class="suggest" id="sFromList" hidden></ul></span></div>
        <label class="srow"><span class="sl"><b data-i18n="maxTransfers"></b><small data-i18n="h_maxTransfers"></small></span><span class="sc"><select id="sTransfers" class="wide"><option value="0" data-i18n="opt0"></option><option value="1" data-i18n="opt1"></option><option value="2" data-i18n="opt2"></option><option value="" data-i18n="any"></option></select></span></label>
        <label class="srow"><span class="sl"><b data-i18n="switchAt"></b><small data-i18n="h_switchAt"></small></span><span class="sc"><input id="sSwitch" type="time"></span></label>
        <div class="srow stack geo-row">
          <label class="geo-top"><span class="sl"><b data-i18n="geoLabel"></b><small data-i18n="h_geoLabel"></small></span>
            <input id="sGeo" type="checkbox" class="switch" role="switch"></label>
          <div id="geoBox" class="geo-box" hidden>
            <div id="geoState" class="geo-state" role="status"></div>
            <div id="geoDetail" class="geo-detail"></div>
            <button id="geoRefresh" type="button" data-i18n="geoRefresh"></button>
          </div>
        </div>
        <label class="srow" id="detectRow"><span class="sl"><b data-i18n="trainDetect"></b><small id="hDetect"></small></span>
          <span class="sc"><input id="sDetect" type="checkbox" class="switch" role="switch"></span></label>
        <label class="srow"><span class="sl"><b data-i18n="minChange"></b><small data-i18n="h_minChange"></small></span><span class="sc"><input id="sChange" type="number" min="0" max="15" inputmode="numeric"><em>min</em></span></label>
      </section>
      <section>
        <h3 data-i18n="secAlerts"></h3>
        <div class="alertfield">
          <label class="check"><input id="sNotify" type="checkbox" class="switch" role="switch"> <span data-i18n="alertsCheck"></span></label>
          <div class="kinds" id="alertKinds"></div>
          <span id="notifState" class="io-msg" role="status"></span>
        </div>
        <label class="srow"><span class="sl"><b data-i18n="minDelay"></b><small data-i18n="h_minDelay"></small></span><span class="sc"><input id="sMin" type="number" min="1" max="60" inputmode="numeric"><em>min</em></span></label>
      </section>
      <section>
        <h3 data-i18n="secDisplay"></h3>
        <label class="srow"><span class="sl"><b data-i18n="longTrip"></b><small data-i18n="h_longTrip"></small></span><span class="sc"><input id="sLong" type="text" inputmode="numeric" placeholder="1:45" pattern="\d{1,2}:\d{2}" size="5"><em>h:mm</em></span></label>
        <label class="srow"><span class="sl"><b data-i18n="veryLongTrip"></b><small data-i18n="h_veryLongTrip"></small></span><span class="sc"><input id="sVeryLong" type="text" inputmode="numeric" placeholder="2:30" pattern="\d{1,2}:\d{2}" size="5"><em>h:mm</em></span></label>
        <label class="srow"><span class="sl"><b data-i18n="longWait"></b><small data-i18n="h_longWait"></small></span><span class="sc"><input id="sWait" type="number" min="1" max="240" inputmode="numeric"><em>min</em></span></label>
        <label class="srow"><span class="sl"><b data-i18n="longWalk"></b><small data-i18n="h_longWalk"></small></span><span class="sc"><input id="sWalk" type="number" min="1" max="240" inputmode="numeric"><em>min</em></span></label>
      </section>
      <section>
        <h3 data-i18n="secData"></h3>
        <div class="keyfield"><b data-i18n="ojpKey"></b>
          <span class="keyrow"><input id="sOjpKey" type="password" autocomplete="off" spellcheck="false" data-i18n-ph="ojpKeyPh">
            <button id="ojpTestBtn" type="button" data-i18n="ojpTest"></button></span>
          <span id="ojpMsg" class="io-msg" role="status"></span></div>
        <div class="hint" data-i18n-html="ojpHint"></div>
        <details class="more-info"><summary data-i18n="dataMore"></summary><div class="hint" data-i18n-html="dataHint"></div></details>
      </section>
      <section>
        <h3 data-i18n="secShare"></h3>
        <div class="io">
          <input id="linkOut" readonly aria-label="Link">
          <button id="copyLinkBtn" data-i18n="copyLink"></button>
          <span id="ioMsg" class="io-msg" role="status"></span>
        </div>
        <div class="hint" data-i18n="linkHint"></div>
      </section>
      <div class="sp-version" id="appVersion"></div>
    </div>
  </aside>
  <div id="quip" class="quip" role="status" hidden></div>
  <footer class="copyright">© 2026 Nicolas Meynet</footer>
</div>

// Is this train still on the departure board of the station where you get on it?

async function onBoard(leg, fallbackStation) {
  if (!leg?.depRaw || !(leg.name || leg.line)) return null;
  try {
    const tm = addMin(leg.depRaw, -2);
    const p = new URLSearchParams({ datetime: `${dayStr(tm)} ${hhmm(tm)}`, limit: 30 });
    if (leg.stationId) p.set("id", leg.stationId); else if (fallbackStation) p.set("station", fallbackStation); else return null;
    const res = await fetch(`${BASE}/stationboard?${p}`, { cache: "no-store" });
    if (!res.ok) return null;
    const board = (await res.json()).stationboard || [];
    return board.some(e => e.stop?.departure === leg.depRaw
      && (e.name === leg.name || (leg.line && `${e.category || ""}${e.number || ""}`.replace(/\s+/g, "") === leg.line)));
  } catch { return null; }
}

  const legs = c.legs?.length ? c.legs : c.firstLeg ? [c.firstLeg] : [];
  for (let i = startAt; i < legs.length; i++) {
    const ok = await onBoard(legs[i], i === 0 ? R().from : null);
    if (ok === null) break;

    res = { kind: "dropped", leg: null }; // this train runs: check the next one

async function detectGone(list, now) {
  const day = todayStr();
  const rid = `${day}|${routeId()}`;
  seen = load(`cff.seen|${routeId()}`, {});

  if (seen._route !== rid) seen = { _route: rid };
  if (usual._route !== routeId()) usual = { _route: routeId() };

  const keys = new Set(list.map(c => c.key));

  const last = list.length ? new Date(list[list.length - 1].dep) : null;
  const inWindow = d => first && last && d >= first && d <= last && (d - now) / 60000 > -10;
  const candidates = [];

  // (1) seen earlier today, now missing: before departure, or already on the way but not arrived yet
  for (const [k, c] of Object.entries(seen)) {
    if (k === "_route" || keys.has(k)) continue;
    const d = new Date(c.dep);
    if (!(first && last && d >= first && d <= last) || arrived(c, now, 2)) continue;
    candidates.push({ ...c, gone: true, source: "vanished", wasEnRoute: departed(c, now) });

  const dt = dayType(now), cutoff = dayStr(new Date(now.getTime() - 21 * 864e5));

    if (p === "_route" || !p.startsWith(dt + "|") || pats.has(p)) continue;
    const pastDays = u.days.filter(d => d !== day && d >= cutoff);
    const missedDays = (u.missed || []).filter(d => d !== day);
    if (pastDays.length < 2 || missedDays.length >= 2) continue; // not a regular train (any more)
    const [h, m] = u.time.split(":").map(Number);

    const arr = new Date(now); arr.setHours(ah, am, 0, 0);

    const depRaw = u.firstLeg?.depTime ? `${day}T${u.firstLeg.depTime}:00${u.firstLeg.tz}` : null;
    candidates.push({
      key: `usual__${p}`, dep: dep.toISOString(), arr: arr.toISOString(), products: u.products,
      depDelay: 0, arrDelay: 0, maxDelay: 0, transfers: u.transfers, platform: u.platform,
      firstLeg: u.firstLeg ? { name: u.firstLeg.name, line: u.firstLeg.line, stationId: u.firstLeg.stationId, depRaw } : null,
      gone: true, source: "usual",

      time: hhmm(d), arr: hhmm(new Date(c.arr)), products: c.products, transfers: c.transfers, platform: c.platform,
      firstLeg: c.firstLeg && fl ? { name: c.firstLeg.name, line: c.firstLeg.line, stationId: c.firstLeg.stationId, depTime: fl[1], tz: fl[2] } : null,
    });

  for (const c of candidates) {
    if (c.wasEnRoute) {

      const next = (c.legs || []).findIndex(l => l.dep && new Date(l.dep).getTime() + (l.depD || 0) * 60000 > now.getTime());

  gone = candidates.filter(c => !(c.source === "usual" && c.goneKind === "dropped"));
}

  // (a trip here takes ~1h30). Make sure the pinned train is always inside the window.
  let from = new Date(now.getTime() - EN_ROUTE_LOOKBACK_MIN * 60000);
  const pinnedDep = pinnedKey && parse(pinnedKey.split("__")[0]);
  if (pinnedDep && pinnedDep < from) from = addMin(pinnedDep.toISOString(), -1);
  const fetchFrom = async start => {
    const p = new URLSearchParams({ from: r.from, to: r.to, date: dayStr(start), time: hhmm(start), limit: 16 });
    const res = await fetch(`${BASE}/connections?${p}`, { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return ((await res.json()).connections || []).map(normalize).filter(c => c.dep);
  };
  try {
    // 1st request: trains on the way + the next ones. 2nd request: continues where the 1st one stopped
    // (or from now), so the list also reaches ~4 h ahead — the API returns at most 16 connections per call.
    const a = await fetchFrom(from);
    const lastA = a.length ? new Date(a[a.length - 1].dep) : now;
    const b = await fetchFrom(lastA < now ? lastA : now);
    if (routeId() !== rid) throw new Error("direction changed"); // the follow-up refresh will load the new direction
    const byKey = new Map([...a, ...b].map(c => [c.key, c]));
    let list = [...byKey.values()].sort((x, y) => new Date(x.dep) - new Date(y.dep));
    // learn from every connection, filter only what is shown (otherwise hidden trains would look "vanished")
    await detectGone(list, now);
    const shown = c => cfg.maxTransfers === "" || (c.transfers ?? 0) <= Number(cfg.maxTransfers);
    current = list.filter(shown);
    gone = gone.filter(shown);
    // hidden by "Direct only" and later than the last direct train: say so at the end of the list
    const lastShown = current.length ? new Date(current[current.length - 1].dep) : now;
    hiddenLater = list.filter(c => !shown(c) && new Date(c.dep) > lastShown && new Date(c.dep) > now);
    // official SBB data (optional, needs the user's own key): cancellations, skipped stops, messages
    await applyOjp(list, from);
    // a train that left a few minutes ago and still has no live data, while trains around it have some
    // (only with SBB data: transport.opendata.ch often has no live data for any regional train)
    const livePeers = list.filter(c => departed(c, now) && c.sbb?.live).length;
    for (const c of list) {
      c.noLive = !!c.sbb && !c.sbb.live && livePeers > 0 && depRtMs(c) < now.getTime() - 3 * 60000 && !arrived(c, now);
    }
    lastFetch = new Date();
    fetchErr = null;
  } catch (e) {
    if (routeId() === rid) fetchErr = navigator.onLine === false ? { key: "offline" } : { key: "apiErr", e: e.message };
  }
  inFlight = false;
  $("refreshBtn").disabled = false;
  if (again) { again = false; return refresh(); }
  render();
  maybeNotify();
  nextAt = Date.now() + cfg.interval * 1000;
  timer = setTimeout(refresh, cfg.interval * 1000);
}

// --- status logic -------------------------------------------------------------
const bigDelay = () => Math.max(cfg.minDelay * 3, 15);
function level(c) {
  if (c.gone || c.sbb?.cancelled || c.sbb?.skips?.length) return "bad";
  if (legStates(c).some(s => s.state === "cancelled" || s.state === "skips")) return "bad";
  if (c.noLive) return "warn";
  if (c.change?.state === "missed" || c.maxDelay >= bigDelay()) return "bad";
  if (c.change?.state === "risk" || c.maxDelay >= cfg.minDelay) return "warn";
  return "ok";
}
// the trip cannot get you there: a train is cancelled or skips your stop, or a change is missed
const tripBroken = c => !!(c.gone || c.change?.state === "missed" || c.sbb?.cancelled || c.sbb?.skips?.length || brokenLeg(c));
// the train of a trip with changes that breaks it (cancelled or skipping your stop), if any
const brokenLeg = c => (c.legs?.length > 1 ? legStates(c).find(s => s.state === "cancelled" || s.state === "skips") : null) || null;
function statusText(c) {
  const bl = brokenLeg(c);
  if (c.gone && c.goneKind === "cancelled" && bl) return t("stLegCancelled", { x: bl.leg.label });
  if (c.gone) return t({ cancelled: "stCancelled", dropped: "stDropped", unverified: "stUnverified", enroute: "stEnroute" }[c.goneKind] || "stUnverified");
  if (bl?.state === "cancelled") return t("stLegCancelled", { x: bl.leg.label });
  if (bl?.state === "skips") return t("stNotServed", { st: bl.detail });
  if (c.sbb?.cancelled) return t("stCancelled");
  if (c.sbb?.skips?.length) return t("stNotServed", { st: c.sbb.skips[0] });
  if (c.change?.state === "missed") return t("stMissed");
  if (c.change?.state === "risk") return t("stRisk");
  if (c.noLive && !c.maxDelay) return t("stNoLive");
  if (c.maxDelay > 0) return `+${t("nMin", { n: c.maxDelay })}`;
  return c.hasRealtime ? t("stOnTime") : t("stScheduled");
}
function explain(c) {
  const multi = c.legs?.length > 1, states = legStates(c);
  const unreach = states.filter(s => s.state === "unreach").map(s => s.leg.label);
  const unreachText = unreach.length ? t("exUnreach", { x: unreach.join(", ") }) : "";
  const stuck = i => i > 0 ? t("exStuck", { at: c.legs[i].from }) : "";
  if (c.gone) {
    const why = t(c.source === "usual" ? "whyUsual" : "whyVanished");
    if (multi && c.goneKind === "cancelled" && c.goneLeg != null && c.legs[c.goneLeg]) {
      return t("exLegGone", { why, x: legName(c.legs[c.goneLeg]) }) + stuck(c.goneLeg) + (unreachText ? " · " + unreachText : "");
    }
    const key = { cancelled: "exCancelled", dropped: "exDropped", unverified: "exUnverified", enroute: "exEnroute" }[c.goneKind] || "exUnverified";
    return t(key, { why, to: R().to });
  }
  const parts = [];
  if (multi) {
    // say which train of the trip is the problem
    states.forEach((s, i) => {
      if (s.state === "cancelled") parts.push(t("exSbbLegCancelled", { x: legName(s.leg) }) + stuck(i));
      if (s.state === "skips") parts.push(t("exSbbLegSkips", { x: legName(s.leg), st: s.detail }) + stuck(normName(s.detail) === normName(s.leg.from) ? i : 0));
    });
  } else {
    if (c.sbb?.cancelled) parts.push(t("exSbbCancelled"));
    if (c.sbb?.skips?.length) parts.push(t("exSbbSkips", { st: c.sbb.skips.join(", ") }));
  }
  if (c.noLive) parts.push(t("exNoLive"));
  // the first change that goes wrong (missed, or at risk) among the ones you can still reach
  const ch = states.map(s => s.change).find(x => x && (x.state === "missed" || x.state === "risk"));
  if (ch) {
    const v = { at: ch.at, prev: ch.prev, next: ch.next, left: ch.left, planned: ch.planned };
    parts.push(t(ch.state === "missed" ? "exMissed" : "exRisk", v));
  }
  if (unreachText) parts.push(unreachText);
  if (c.maxDelay >= cfg.minDelay) parts.push(t("exLate", { n: c.maxDelay }) + (c.arrDelay ? t("exArrival", { t: hhmm(addMin(c.arr, c.arrDelay)) }) : ""));
  return parts.join(" · ");
}
// When a train is cancelled, its change is missed or it is very late: the upcoming train that gets you
// to the destination soonest (live times), skipping trains that are themselves in trouble.
function bestAlternative(c, all, now) {
  // once you are on board, other trains from your departure station are no help
  if (level(c) !== "bad" || departed(c, now)) return null;
  const mineArr = tripBroken(c) ? Infinity : addMin(c.arr, c.arrDelay).getTime();
  const options = all.filter(o => o.key !== c.key && !o.gone && level(o) !== "bad"
      && addMin(o.dep, o.depDelay).getTime() > now.getTime() + 60000
      && addMin(o.arr, o.arrDelay).getTime() < mineArr)
    .sort((a, b) => addMin(a.arr, a.arrDelay) - addMin(b.arr, b.arrDelay));
  return options[0] || null;
}
function altText(o, c) {
  const arr = addMin(o.arr, o.arrDelay);
  const lost = tripBroken(c) ? Math.round((arr - new Date(c.arr)) / 60000) : null;
  return `${hhmm(addMin(o.dep, o.depDelay))} ${o.products.join(" + ")}`
    + (o.platform ? t("altPlatform", { p: o.rtPlatform || o.platform }) : "")
    + t("altArrives", { t: hhmm(arr) })
    + (lost > 0 ? t("altLost", { n: lost }) : "");
}

// live (delay-adjusted) times
const depRtMs = c => new Date(c.dep).getTime() + (c.depDelay || 0) * 60000;
const arrRtMs = c => new Date(c.arr).getTime() + (c.arrDelay || 0) * 60000;
const departed = (c, now) => depRtMs(c) <= now.getTime();
const arrived = (c, now, graceMin = 0) => arrRtMs(c) < now.getTime() - graceMin * 60000;
const enRoute = (c, now) => departed(c, now) && !arrived(c, now);
// total trip time with live delays; a small warning when it is longer than the threshold (default 1h45)
const fmtDur = m => `${Math.floor(m / 60)}h${pad(m % 60)}`;
function durationHtml(c) {
  if (!c.dep || !c.arr) return "";
  const m = Math.round((arrRtMs(c) - depRtMs(c)) / 60000);
  if (!(m > 0)) return "";
  // red above the second limit (default 2h30), amber above the first one (default 1h45)
  const red = Number(cfg.veryLongTrip), amber = Number(cfg.longTrip);
  if (m > red) return ` · <span class="long vlong" title="${esc(t("longTitle", { t: fmtDur(red) }))}">⏳ ${fmtDur(m)}</span>`;
  if (m > amber) return ` · <span class="long" title="${esc(t("longTitle", { t: fmtDur(amber) }))}">⏳ ${fmtDur(m)}</span>`;
  return ` · ${fmtDur(m)}`;
}

function occHtml(c) {
  const one = (clsKey, v) => v ? `<span class="occ l${v}" title="${esc(t("occTitle", { cls: t(clsKey), lvl: t("occ" + v) }))}">${t(clsKey)}<span class="bars"><i></i><i></i><i></i></span></span>` : "";
  return one("cls1", c.cap1) + one("cls2", c.cap2);
}

// line badges: for a trip with changes, one per train, coloured by that train's state
function prodsHtml(c) {
  if (!(c.legs?.length > 1)) return c.products.map(p => `<span class="prod">${esc(p)}</span>`).join("");
  return legStates(c).map(s => {
    const lv = legLevel(s.state);
    return `<span class="prod ${lv === "ok" ? "" : lv}" title="${esc(legName(s.leg) + " · " + legStateText(s))}">${esc(s.leg.label)}</span>`;
  }).join("");
}
function legStateText(s) {
  const d = Math.max(s.leg.depD || 0, s.leg.arrD || 0);
  return { cancelled: t("stCancelled"), skips: t("stNotServed", { st: s.detail }), unreach: t("legUnreach") }[s.state]
    || (d ? `+${t("nMin", { n: d })}` : t("stOnTime"));
}
// the trains of a trip with changes, one by one, and each change between them
// long waits at a station and long walks between stations (above the limits in Settings),
// among the changes you can still make
function longGaps(c) {
  return legStates(c).flatMap((s, i) => {
    const ch = s.change, next = c.legs?.[i + 1];
    if (!ch || !next || ch.state !== "ok" || s.state === "unreach") return [];
    const walk = normName(s.leg.to) !== normName(next.from);
    return ch.left > Number(walk ? cfg.longWalk : cfg.longWait) ? [{ walk, at: s.leg.to, to: next.from, mins: ch.left }] : [];
  });
}
function legsHtml(c) {
  if (!(c.legs?.length > 1)) return "";
  const tm = (iso, d) => iso ? (d ? `<s>${hhmm(new Date(iso))}</s> <b class="${d >= bigDelay() ? "vlate" : "late"}">${hhmm(addMin(iso, d))}</b>` : hhmm(new Date(iso))) : "";
  const icon = { ok: "✅", warn: "⚠️", bad: "⛔", off: "✖" };
  const rows = legStates(c).map((s, i) => {
    const lv = legLevel(s.state), l = s.leg;
    let row = `<li class="leg ${lv}"><span class="licon">${icon[lv]}</span>
        <span class="lname"><b>${esc(l.label)}</b> ${esc(l.from)} ${tm(l.dep, l.depD)} → ${esc(l.to)} ${tm(l.arr, l.arrD)}</span>
        <span class="lstate">${esc(legStateText(s))}</span></li>`;
    const ch = s.change;
    if (ch && ch.state !== "unreach") { // no point detailing changes you cannot reach any more
      const txt = ch.state === "missed" ? t("legChangeMissed", { n: ch.left })
        : ch.state === "risk" ? t("legChangeTight", { n: ch.left, p: ch.planned })
        : t("legChangeLeft", { n: ch.left });
      const walkHere = normName(l.to) !== normName(c.legs[i + 1]?.from);
      const longWait = ch.state === "ok" && ch.left > Number(walkHere ? cfg.longWalk : cfg.longWait);
      row += `<li class="lchg ${ch.state}${longWait ? " long" : ""}">↳ ${esc(t("legChange", { at: ch.at }))} · ${esc(txt)}</li>`;
    }
    return row;
  }).join("");

// The trip as a line under each time: one dot where you get on, one per change of train and one
// where you get off, placed by the timetable; one coloured part per train. Green = fine, amber = late
// or tight change, red = problem there (cancelled train, stop not served, change missed, very late),
// grey = no longer reachable. Dotted = walk to another station.
let legendOpen = null; // the legend on the top card: open on a computer, folded on a phone, until you choose
function trackHtml(c, now, big = false) {
  const legs = (c.legs || []).filter(l => l.dep && l.arr);
  if (!legs.length || legs.length !== (c.legs || []).length) return "";
  const states = legStates(c), whole = c.gone && c.goneLeg == null;
  const t0 = new Date(legs[0].dep).getTime(), t1 = new Date(legs[legs.length - 1].arr).getTime();
  if (!(t1 > t0)) return "";
  const x = iso => Math.min(100, Math.max(0, (new Date(iso).getTime() - t0) / (t1 - t0) * 100));
  const delayLv = d => d >= bigDelay() ? "bad" : d >= cfg.minDelay ? "warn" : "ok";
  const broken = s => s.state === "cancelled" || s.state === "skips";
  const late = d => d ? ` · +${t("nMin", { n: d })}` : "";
  const parts = [], dots = [], labels = [];

  const dot = (iso, lv, info) => dots.push(`<i class="dot big ${lv}" style="left:${x(iso).toFixed(2)}%" title="${esc(info)}"></i>`);
  const seg = (a, b, lv) => parts.push(`<i class="seg ${lv}" style="left:${x(a).toFixed(2)}%;width:${(x(b) - x(a)).toFixed(2)}%"></i>`);
  legs.forEach((l, i) => {
    const s = states[i], lvTrain = whole ? "bad" : legLevel(s.state);
    seg(l.dep, l.arr, lvTrain);
    if (i === 0) {
      const lv = whole || broken(s) ? "bad" : delayLv(Math.max(l.depD || 0, c.depDelay || 0));
      dot(l.dep, lv, `${l.from} ${hhmm(new Date(l.dep))} · ${l.label}${late(l.depD)}${broken(s) ? " · " + legStateText(s) : ""}`);
    }
    const next = legs[i + 1];
    if (!next) {
      const lv = s.state === "unreach" ? "off" : whole || broken(s) ? "bad" : delayLv(Math.max(l.arrD || 0, c.arrDelay || 0));
      dot(l.arr, lv, `${l.to} ${hhmm(new Date(l.arr))}${lv === "off" ? " · " + t("legUnreach") : late(l.arrD)}`);
      return;
    }

    if (s.state === "unreach") lv = "off";

    const chText = !ch || ch.state === "unreach" || s.state === "unreach" ? t("legUnreach")
      : ch.state === "missed" ? t("legChangeMissed", { n: ch.left }) : ch.state === "risk" ? t("legChangeTight", { n: ch.left, p: ch.planned })
      : t("legChangeLeft", { n: ch.left });

    // with an icon and the minutes left to change (live)
    const walk = normName(l.to) !== normName(next.from);
    const mins = ch && ch.state !== "unreach" && s.state !== "unreach" ? ch.left : Math.round((new Date(next.dep) - new Date(l.arr)) / 60000);

      const longWait = mins > Number(walk ? cfg.longWalk : cfg.longWait);
      seg(l.arr, next.dep, (walk ? "walk" : "wait") + (longWait ? " long" : ""));
      const mid = (x(l.arr) + x(next.dep)) / 2;
      // labels too close to the previous one go one line lower, so they don't overlap
      const low = lastLabel && !lastLabel.low && mid - lastLabel.x < (big ? 7 : 11);
      lastLabel = { x: mid, low };
      const txt = `${walk ? "🚶" : "⏱"} ${mins < 0 ? "✖" : mins >= 60 ? fmtDur(mins) : mins + "′"}`;
      const extra = ch && ch.state !== "ok" ? " · " + chText : "";
      labels.push(`<span class="slab ${lv === "ok" && longWait ? "warn" : lv}${low ? " low" : ""}" style="left:${mid.toFixed(2)}%" title="${esc(gapTitle + extra)}">${esc(txt)}</span>`);
      if (low) lowLabels = true;

  // the part already travelled stays in full colour, what is left is paler, and a glowing dot shows the train
  let lineHtml = parts.join(""), nowHtml = "";
  if (enRoute(c, now) && !c.gone) {
    const st = c.stops || [], pos = position(c, now);
    const sx = k => st[k] ? x(st[k].dep && k < st.length - 1 ? st[k].dep : st[k].arr) : 0;
    if (pos && pos.kind !== "before") {
      const px = Math.min(100, Math.max(0, pos.kind === "between" ? sx(pos.i) + (sx(pos.i + 1) - sx(pos.i)) * pos.frac : sx(pos.i)));
      lineHtml = `<div class="tl" style="clip-path:inset(0 ${(100 - px).toFixed(2)}% 0 0)">${lineHtml}</div>`
        + `<div class="tl todo" style="clip-path:inset(0 0 0 ${px.toFixed(2)}%)">${lineHtml}</div>`;
      nowHtml = `<span class="now ${level(c)}" style="left:${px.toFixed(2)}%" title="${esc(positionText(c, now))}"></span>`;
    }
  }
  return `<div class="track${big ? " hero-track" : ""}${labels.length ? " labelled" : ""}${lowLabels ? " low2" : ""}">${lineHtml}${dots.join("")}${labels.join("")}${nowHtml}</div>`
    + (big ? `<details class="tlegend-wrap"${(legendOpen ?? window.innerWidth > 560) ? " open" : ""}><summary>${esc(t("legend"))}</summary><div class="tlegend"><span><i class="lg-train"></i>${esc(t("lgTrain"))}</span><span><i class="lg-dot"></i>${esc(t("lgChange"))}</span><span>⏱ ${esc(t("lgWait"))}</span><span>🚶 ${esc(t("lgWalk"))}</span><span><i class="lg-train ok"></i>${esc(t("lgOk"))} <i class="lg-train warn"></i>${esc(t("lgLate"))} <i class="lg-train bad"></i>${esc(t("lgBad"))} <i class="lg-train off"></i>${esc(t("lgOff"))}</span></div></details>` : "");
}

// which fun line goes with this train's status (same logic as statusText)
function quipKey(c, now = new Date()) {
  if (c.gone) return { cancelled: "cancelled", dropped: "dropped", unverified: "likely", enroute: "disrupted" }[c.goneKind] || "likely";
  const bl = brokenLeg(c);
  if (bl?.state === "cancelled" || c.sbb?.cancelled) return "cancelled";
  if (bl?.state === "skips" || c.sbb?.skips?.length) return "skips";
  if (c.change?.state === "missed") return "missed";
  if (c.change?.state === "risk") return "risk";
  if (c.noLive && !c.maxDelay) return "nolive";
  if (c.maxDelay >= bigDelay()) return "vlate";
  if (c.maxDelay >= cfg.minDelay) return "late";
  if (enRoute(c, now)) return "enroute";
  return c.hasRealtime ? "ontime" : "scheduled";
}
// the same train keeps the same line (no flicker at every refresh)
function quipText(c) {
  const list = (QUIPS[lang] || QUIPS.en)[quipKey(c)] || [];
  let h = 0; for (const ch of c.key) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return list[h % list.length] || "";
}
const quipBtn = c => { const q = quipText(c); return q ? `<button type="button" class="quip-btn" data-quip="${esc(q)}" aria-label="${esc(t("quipInfo"))}" title="${esc(t("quipInfo"))}">ⓘ</button>` : ""; };
// one small bubble for the whole page, opened next to the ⓘ that was clicked
let quipFor = null;
function showQuip(btn) {
  const pop = $("quip");
  if (!pop.hidden && quipFor === btn) { pop.hidden = true; return; } // a 2nd click on the same ⓘ closes it
  pop.textContent = btn.dataset.quip; quipFor = btn; pop.hidden = false;
  const b = btn.getBoundingClientRect(), w = Math.min(320, window.innerWidth - 32);
  pop.style.width = w + "px";
  pop.style.left = Math.max(16, Math.min(window.innerWidth - w - 16, b.right - w)) + "px";
  const below = b.bottom + 8, h = pop.offsetHeight;
  pop.style.top = (below + h > window.innerHeight - 8 ? Math.max(8, b.top - h - 8) : below) + "px";
}
// capture phase: the ⓘ in a list row must not also pin that train
document.addEventListener("click", e => {
  const btn = e.target.closest(".quip-btn");
  if (btn) { e.stopPropagation(); showQuip(btn); return; }
  if (!e.target.closest("#quip")) $("quip").hidden = true;
}, true);
document.addEventListener("keydown", e => { if (e.key === "Escape") $("quip").hidden = true; });
window.addEventListener("scroll", () => { $("quip").hidden = true; }, { passive: true });

// The trains that matter to you now, in the current direction: the pinned one (the one you are on
// or will take), otherwise every train leaving in the next 2 hours.
function alertTargets() {
  const now = Date.now(), all = [...current, ...gone];
  return pinnedKey ? all.filter(c => c.key === pinnedKey && !arrived(c, new Date()))
    : all.filter(c => { const d = new Date(c.dep).getTime(); return d > now - 5 * 60000 && d < now + 120 * 60000; });
}
// Badge on the app icon in the taskbar (installed app only): HOW MANY of those trains have a problem
// you chose to be alerted about (by default: cancelled or skipping your stop, change missed, very
// late). No badge when none of them has one, or when alerts are off.
let badgeShown = null;
function updateBadge() {
  if (!("setAppBadge" in navigator)) return;
  const n = notifyOn ? alertTargets().filter(c => level(c) !== "ok" && wantsAlert(c)).length : 0;
  if (n === badgeShown) return;
  badgeShown = n;
  (n ? navigator.setAppBadge(n) : navigator.clearAppBadge()).catch(() => {});
}

// a time on the top card: the live time, with the scheduled one crossed out when it differs
// (beside it on a wide screen, above it on a phone, so departure → arrival stays on one line)
const heroTime = (sched, live, delay) => `<span class="tm">${delay ? `<s>${hhmm(sched)}</s>` : ""}<b>${hhmm(delay ? live : sched)}</b></span>`;

// --- rendering ------------------------------------------------------------------
function render() {
  paintDir();
  const now = new Date();
  // keep every train until it has reached the destination (+5 min), not just until it leaves
  const all = [...current, ...gone].filter(c => !arrived(c, now, 5)).sort((a, b) => new Date(a.dep) - new Date(b.dep));

  let mine = all.find(c => c.key === pinnedKey);
  if (mine && arrived(mine, now, 2)) { mine = null; pinnedKey = null; save("cff.pinned", null); } // you're there: unpin
  const isPinned = !!mine;
  if (!mine) mine = all.find(c => !departed(c, now));
  updateBadge();
  paintDetect();
  const hero = $("hero");
  if (!mine) {
    hero.className = "hero";
    hero.innerHTML = `<div><div class="kicker">${t("nextTrain")}</div><div class="times">–</div><div class="meta">${esc(t("noConn"))}</div></div>`;
  } else {
    const lv = level(mine), dep = new Date(mine.dep), arr = new Date(mine.arr);
    const depRt = addMin(mine.dep, mine.depDelay), arrRt = addMin(mine.arr, mine.arrDelay);
    const mins = Math.round((depRt - now) / 60000);
    const plat = mine.rtPlatform && mine.rtPlatform !== mine.platform
      ? `<b class="late">${esc(t("platform", { p: mine.rtPlatform }))}</b> ${esc(t("platformWas", { p: mine.platform }))}`
      : (mine.platform ? esc(t("platform", { p: mine.platform })) : "");
    const why = lv !== "ok" ? explain(mine) : "";
    const alt = bestAlternative(mine, all, now);
    const altMins = alt ? Math.round((addMin(alt.dep, alt.depDelay) - now) / 60000) : 0;
    const altHtml = alt ? `<div class="alt">
        <div><div class="kicker">${esc(t("altKicker", { n: altMins }))}</div>
        <b>${esc(altText(alt, mine))}</b> ${occHtml(alt)}</div>
        <button data-pin="${esc(alt.key)}">${esc(t("altSwitch"))}</button></div>`
      : lv === "bad" && !departed(mine, now) && tripBroken(mine) ? `<div class="alt none">${esc(t("altNone"))}</div>` : "";
    // the train you are on: big "time left", live arrival, next stop and how far along the trip you are
    const onBoard = isPinned && enRoute(mine, now) && !mine.gone;
    let remainHtml = "";
    if (onBoard) {
      const left = Math.max(0, Math.ceil((arrRt - now) / 60000));
      const frac = Math.min(1, Math.max(0, (now - depRt) / Math.max(1, arrRt - depRt)));
      const pos = position(mine, now), st = mine.stops || [];
      const nextStop = pos && (pos.kind === "between" || pos.kind === "at") && st[pos.i + 1] && pos.i + 1 < st.length - 1 ? st[pos.i + 1] : null;
      remainHtml = `<div class="remain">
          <div class="kicker">⏱ ${esc(t("remainLabel"))}</div>
          <div class="rline"><span class="rbig">${esc(left < 60 ? t("nMin", { n: left }) : fmtDur(left))}</span>
            <span class="rinfo">${esc(t("remainArr", { t: hhmm(arrRt), st: mine.stops?.[mine.stops.length - 1]?.name || R().to }))}${nextStop ? " · " + esc(t("nextStop", { st: nextStop.name, t: hhmm(new Date(stopArrMs(nextStop) ?? stopDepMs(nextStop))) })) : ""}</span></div>
          <div class="rbar" role="progressbar" aria-valuenow="${Math.round(frac * 100)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${(frac * 100).toFixed(1)}%"></i></div>
        </div>`;
    }
    hero.className = `hero ${lv}`;
    hero.innerHTML = `
      <div>
        <div class="kicker">${isPinned ? esc(t("yourTrain")) + (enRoute(mine, now) ? " · " + esc(t("onTheWay")) : "") : esc(t("nextTrain"))}</div>
        <div class="times">${heroTime(dep, depRt, mine.depDelay)}<span class="tarrow">→</span>${heroTime(arr, arrRt, mine.arrDelay)}</div>
        <div class="meta">${prodsHtml(mine)} ${mine.headsign && !mine.transfers ? esc(t("towards", { x: mine.headsign })) + " · " : ""}${esc(transfersText(mine.transfers))}${plat ? " · " + plat : ""}${durationHtml(mine)}${occHtml(mine)}</div>
        ${why ? `<div class="why">${esc(why)}</div>` : ""}
        ${sbbMsgsHtml(mine)}
      </div>
      <div>
        <div class="big">${esc(statusText(mine))} ${quipBtn(mine)}</div>
        <div class="countdown">${mine.gone || onBoard ? "" : esc(mins > 0 ? t("departsIn", { n: mins }) : mins > -2 ? t("departingNow")
          : t("arrivesIn", { n: Math.max(0, Math.round((arrRt - now) / 60000)) }))}</div>
      </div>
      ${trackHtml(mine, now, true)}
      ${legsHtml(mine)}
      ${remainHtml}
      ${altHtml}
      ${isPinned && !mine.gone ? stopsHtml(mine, now) : ""}`;
    const lg = hero.querySelector("details.tlegend-wrap");
    if (lg) lg.ontoggle = () => { legendOpen = lg.open; };
    const sd = hero.querySelector("details.stops");
    if (sd) sd.ontoggle = () => { stopsOpen = sd.open; };
  }

  const alerts = [];
  if (lastFetch && Date.now() - lastFetch > (cfg.interval * 2 + 30) * 1000) {
    alerts.push(`<div class="alert warn">${esc(t("stale", { n: Math.round((Date.now() - lastFetch) / 60000) }))}</div>`);
  }
  for (const c of all) {
    const lv = level(c);
    // trains already on their way: alert only for the one you pinned (the one you are on)
    if (lv === "ok" || (departed(c, now) && c.key !== pinnedKey)) continue;
    const alt = bestAlternative(c, all, now);
    alerts.push(`<div class="alert ${lv}">${lv === "bad" ? "⛔" : "⚠️"} ${esc(`${hhmm(new Date(c.dep))} ${c.products.join(", ")}`)} — ${esc(explain(c))}${alt ? `<br>→ ${esc(t("takeInstead", { x: altText(alt, c) }))}` : ""}</div>`);
  }

  const rowHtml = c => {
    const lv = level(c), dep = new Date(c.dep), arr = new Date(c.arr);
    const rtCls = c.maxDelay >= bigDelay() ? "vlate" : "late";
    const platChange = c.rtPlatform && c.rtPlatform !== c.platform;
    const onWay = enRoute(c, now);
    const platHtml = c.platform ? " · " + (platChange
      ? `<b class="late">${esc(t("pl", { p: c.rtPlatform }))}</b> <s>${esc(c.platform)}</s>` : esc(t("pl", { p: c.platform }))) : "";
    const gapsHtml = longGaps(c).map(g => ` · <b class="late" title="${esc(t(g.walk ? "walkTitle" : "waitTitle", { a: g.at, b: g.to, n: g.mins }))}">${g.walk ? "🚶" : "⏱"} ${esc(g.mins >= 60 ? fmtDur(g.mins) : t("nMin", { n: g.mins }))} ${esc(g.at)}</b>`).join("");
    const changeHtml = c.change ? ` · <b class="${c.change.state === "missed" ? "vlate" : "late"}">${esc(t("changeAt", { at: c.change.at, x: c.change.state === "missed" ? t("missed") : t("nMin", { n: c.change.left }) }))}</b>` : "";
    return `<div class="row ${departed(c, now) && c.key !== pinnedKey ? "past" : ""} ${c.gone ? "gone" : ""} ${c.key === pinnedKey ? "pinned" : ""}" data-key="${esc(c.key)}" title="${esc(explain(c) || t("pinTitle"))}">
      <div class="pin">${c.key === pinnedKey ? "📌" : "○"}</div>
      <div class="t">${hhmm(dep)} → ${hhmm(arr)}${c.maxDelay ? `<span class="rt ${rtCls}">${hhmm(addMin(c.dep, c.depDelay))} → ${hhmm(addMin(c.arr, c.arrDelay))}</span>` : ""}</div>
      <div class="det">${prodsHtml(c)}${occHtml(c)}${c.sbb?.msgs?.length ? `<span class="sbb-ico" title="${esc(c.sbb.msgs.map(msgText).join("\n\n"))}">ℹ️</span>` : ""}
        <div class="sub">${onWay ? `<b>${esc(t("rowOnWay", { t: hhmm(new Date(arrRtMs(c))) }))}</b> · ` : arrived(c, now) ? `<b>${esc(t("arrived"))}</b> · ` : ""}${esc(transfersText(c.transfers))}${platHtml}${durationHtml(c)}${changeHtml}${gapsHtml}</div></div>
      <span class="chipwrap">${quipBtn(c)}<span class="chip ${lv}">${esc(statusText(c))}</span></span>
      ${trackHtml(c, now)}
    </div>`;
  };
  // other trains already on the way: folded at the top, highlighted when one of them has a problem
  const onWayList = all.filter(c => departed(c, now) && c.key !== pinnedKey);
  const mainList = all.filter(c => !onWayList.includes(c));
  const troubled = onWayList.filter(c => level(c) !== "ok");
  const worst = troubled.some(c => level(c) === "bad") ? "bad" : troubled.length ? "warn" : "";
  const issueText = troubled.map(c => `${hhmm(new Date(c.dep))} ${statusText(c)}`).join(", ");
  $("list").innerHTML = !all.length
    ? `<div class="empty">${esc(inFlight || again || !lastFetch ? t("loadingConn") : t("noConn"))}</div>`
    : (onWayList.length ? `<details class="onway ${worst}" ${onWayOpen ? "open" : ""}>
          <summary>${esc(t("onWayHeader", { n: onWayList.length }))} · ${troubled.length ? `${worst === "bad" ? "⛔" : "⚠️"} ${esc(t("withIssues", { n: troubled.length, x: issueText }))}` : esc(t("allFine"))}</summary>
          ${onWayList.map(rowHtml).join("")}</details>` : "")
      + (mainList.length ? mainList.map(rowHtml).join("") : `<div class="empty">${esc(t("noMoreDep"))}</div>`)
      + (hiddenLater.length ? `<div class="more">${esc(mainList.length
            ? t("noDirectAfter", { t: hhmm(new Date(mainList[mainList.length - 1].dep)) })

function paintDir() {
  const labels = { out: `${cfg.from} → ${cfg.to}`, back: `${cfg.to} → ${cfg.from}` };
  const other = curDir === "out" ? "back" : "out";
  // B → A is the morning direction, A → B the afternoon one; "manual" when you swapped it yourself
  const manualNow = override && Date.now() < override.until;
  const onTrain = !manualNow && geoOn && pinnedOnWay();
  const byGeo = !manualNow && !onTrain && geoDirection();
  $("dirWhen").textContent = t(manualNow ? "dirManual" : onTrain ? "dirOnTrain" : byGeo ? (curDir === "back" ? "dirNearHome" : "dirNearWork")
    : geoOn ? "dirGeoLast" : curDir === "back" ? "dirMorning" : "dirAfternoon");
  $("dirRoute").textContent = labels[curDir];
  $("dirSwap").dataset.dir = other;
  $("dirSwap").textContent = "⇄ " + t("swapDir");
  $("dirSwap").title = t("swapTitle", { r: labels[other] });
  const manual = override && Date.now() < override.until;
  const nb = nextBoundary(), nextAuto = labels[autoDir(new Date(nb))];
  $("routeLabel").textContent = manual ? t("manualUntil", { t: hhmm(new Date(override.until)) })
    : onTrain ? t("geoKeptTrain")
    : byGeo ? t("geoAuto", { d: fmtKm(geo.km), st: geo.st })
    : geoOn ? (geo?.state ? t({ far: "geoFar", denied: "geoDenied", none: "geoNone" }[geo.state]) : t("geoChecking"))
    : t("autoSwitch", { r: nextAuto, t: hhmm(new Date(nb)) });
  paintGeoState();
}
function switchDir() {
  curDir = dirNow();
  pinnedKey = null; save("cff.pinned", null);
  current = []; gone = []; hiddenLater = []; lastFetch = null; fetchErr = null;
  render(); refresh();

function setupStationSearch(id, key) {

      ? items.map((st, i) => `<li data-i="${i}" class="${i === active ? "on" : ""}"><span>${STATION_ICON[st.icon] || "📍"}</span>${esc(st.name)}</li>`).join("")
      : `<li class="none">${esc(t(input.value.trim().length < 2 ? "searchHint" : "noStation"))}</li>`;
    list.hidden = false;
  };
  const choose = st => {
    close();
    if (!st) { input.value = cfg[key]; return; }    // nothing chosen: keep the current station
    input.value = st.name;

          .map((st, i) => ({ name: st.name, icon: st.icon, i }))

    else if (e.key === "ArrowUp") { e.preventDefault(); active = Math.max(0, active - 1); paint(); }

    const li = e.target.closest("li[data-i]"); if (!li) return;

  });

const OJP_URL = "https://api.opentransportdata.swiss/ojp20";

<Destination><PlaceRef><StopPlaceRef>${xmlEsc(toId)}</StopPlaceRef></PlaceRef></Destination>
