      const first = c.stops[0], last = c.stops[c.stops.length - 1];
      c.depDelay = Math.max(c.depDelay, first.depD || 0);
      c.arrDelay = Math.max(c.arrDelay, last.arrD || 0);
      c.maxDelay = Math.max(c.maxDelay, c.depDelay, c.arrDelay, ...c.stops.map(st => Math.max(st.arrD || 0, st.depD || 0)));
      c.hasRealtime = true;
    }
  }
}
function sbbMsgsHtml(c) {
  const msgs = c.sbb?.msgs || [];
  if (!msgs.length) return "";
  return `<ul class="sbbmsg">${msgs.slice(0, 3).map(m => { const v = msgText(m); return `<li title="${esc(v)}"><b>ℹ️ ${esc(t("logo"))}</b> ${esc(v.length > 260 ? v.slice(0, 257) + "…" : v)}</li>`; }).join("")}</ul>`;
}
$("sOjpKey").value = getOjpKey();
$("sOjpKey").onchange = () => {
  try { localStorage.setItem("cff.ojpKey", $("sOjpKey").value.trim()); } catch {}
  $("ojpMsg").textContent = ""; refresh();
};
$("ojpTestBtn").onclick = async () => {
  const key = $("sOjpKey").value.trim(), msg = (k, v, err) => { $("ojpMsg").textContent = t(k, v); $("ojpMsg").className = "io-msg" + (err ? " err" : ""); };
  if (!key) return msg("ojpNoKey", {}, true);
  try { localStorage.setItem("cff.ojpKey", key); } catch {}
  const ref = current.find(c => c.fromId && c.toId);
  if (!ref) return msg("ojpNet", { e: "no trains" }, true);
  $("ojpTestBtn").disabled = true;
  const res = await ojpFetch(key, ref.fromId, ref.toId, new Date(Date.now() - 30 * 60000));
  $("ojpTestBtn").disabled = false;
  if (res.ok) msg("ojpOk", { n: res.data.trips, m: Object.keys(res.data.sits).length });
  else if (res.code) msg("ojpBad", { c: res.code }, true);
  else msg("ojpNet", { e: res.e }, true);
  refresh();
};

// --- direction from your location ----------------------------------------------------
const fmtKm = km => new Intl.NumberFormat(lang, { maximumFractionDigits: km < 10 ? 1 : 0 }).format(km);
function kmBetween(a, b) {
  const R = 6371, rad = x => x * Math.PI / 180;
  const dLat = rad(b[0] - a[0]), dLon = rad(b[1] - a[1]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a[0])) * Math.cos(rad(b[0])) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
// coordinates of a station, looked up once and kept in this browser
async function stationCoord(name) {
  const cache = load("cff.coords", {});
  if (cache[name]) return cache[name];
  const res = await fetch(`${BASE}/locations?${new URLSearchParams({ query: name, type: "station" })}`);
  const st = ((await res.json()).stations || []).find(x => x.coordinate?.x && x.coordinate?.y);
  if (!st) return null;
  cache[name] = [st.coordinate.x, st.coordinate.y]; save("cff.coords", cache);
  return cache[name];
}
let geoBusy = false, geoLast = 0;
async function checkGeo(force = false) {
  if (!geoOn || geoBusy || (!force && Date.now() - geoLast < 2 * 60000)) return;
  geoBusy = true; geoLast = Date.now(); paintGeoState();
  try {
    if (!("geolocation" in navigator)) throw { code: 0 };
    const pos = await new Promise((ok, ko) => navigator.geolocation.getCurrentPosition(ok, ko, { timeout: 15000, maximumAge: detectOn ? 60000 : 5 * 60000 }));
    const me = [pos.coords.latitude, pos.coords.longitude];
    const [home, work] = await Promise.all([stationCoord(cfg.to), stationCoord(cfg.from)]);
    if (!home || !work) throw { code: 0 };
    const dHome = kmBetween(me, home), dWork = kmBetween(me, work);
    const near = Math.min(dHome, dWork);
    const info = { dHome, dWork, acc: pos.coords.accuracy, at: Date.now(), me };
    geo = near > GEO_MAX_KM ? { state: "far", ...info }
      : { dir: dHome < dWork ? "back" : "out", km: near, st: dHome < dWork ? cfg.to : cfg.from, ...info };
    if (geo.dir) { lastGeoDir = geo.dir; save("cff.geoLastDir", lastGeoDir); }
  } catch (e) {
    geo = { state: e?.code === 1 ? "denied" : "none", at: Date.now() };
  }
  geoBusy = false;
  if (dirNow() !== curDir) switchDir(); else { paintDir(); render(); }
}
// what was found: the direction it gives, the distance to each station, how precise, and when
function paintGeoState() {
  $("sGeo").checked = geoOn;
  paintDetectSetting();
  const sw = $("sSwitch"), swRow = sw.closest(".srow");
  sw.disabled = geoOn; swRow.classList.toggle("off", geoOn);
  swRow.querySelector("small").textContent = t(geoOn ? "switchOff" : "h_switchAt");
  $("geoBox").hidden = !geoOn;
  if (!geoOn) return;
  const st = $("geoState"), det = $("geoDetail");
  st.className = "geo-state";
  if (geoBusy) { st.textContent = "📍 " + t("geoChecking"); det.textContent = ""; return; }
  if (!geo) { st.textContent = ""; det.textContent = ""; return; }
  if (pinnedOnWay()) st.textContent = "🚆 " + t("geoKeptTrain");
  else if (geo.dir) st.textContent = "📍 " + t(geo.dir === "back" ? "geoNearHome" : "geoNearWork", { st: geo.st, d: fmtKm(geo.km) });
  else { st.textContent = "📍 " + t({ far: "geoFar", denied: "geoDenied", none: "geoNone" }[geo.state]); if (geo.state !== "far") st.className = "geo-state err"; }
  det.textContent = geo.dHome == null ? "" : [
    t("geoDist", { st: cfg.to, d: fmtKm(geo.dHome) }) + " · " + t("geoDist", { st: cfg.from, d: fmtKm(geo.dWork) }),
    t("geoAcc", { m: geo.acc >= 1000 ? fmtKm(geo.acc / 1000) + " km" : Math.round(geo.acc) + " m", t: hhmm(new Date(geo.at)) }),
  ].join("\n");
}
$("geoRefresh").onclick = () => checkGeo(true);
$("sGeo").onchange = () => {
  geoOn = $("sGeo").checked; save("cff.geoDir", geoOn);
  if (geoOn) checkGeo(true);
  else { geo = null; if (dirNow() !== curDir) switchDir(); else paintDir(); }
};
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkGeo(); });
window.addEventListener("focus", () => checkGeo());

// --- version ---------------------------------------------------------------------------
// APP_VERSION is set by hand at each release; the update date comes from the server (the date the
// page was last published), so it is always right even if the version is not bumped.
const APP_VERSION = "2026.11.18.7";
const REPO_URL = "https://github.com/nicoMeynet/cff-route-watch";
function paintVersion() {
  const d = new Date(document.lastModified);
  const when = isNaN(d) ? "" : new Intl.DateTimeFormat(lang, { dateStyle: "medium", timeStyle: "short" }).format(d);
  $("appVersion").innerHTML = `${esc(t("version", { v: APP_VERSION }))}${when ? "<br>" + esc(t("updatedOn", { d: when })) : ""}`
    + `<br><a href="${REPO_URL}/commits/main" target="_blank" rel="noopener">${esc(t("changes"))} ↗</a>`;
}

// --- which train am I on? ----------------------------------------------------------------
// With the location on (and a precise enough position), compare your position with the estimated
// position of each train: on the way (between two stops, from the timetable and live delays) or about
// to leave your station. The nearest one, close enough, is offered as "your train" (one click).
let detectOn = load("cff.trainDetect", true);
let detectNo = load("cff.detectNo", []); // trains you said "no" to
let suggestion = null; // { key, before }
function trainPoint(c, now) {
  const st = c.stops || [], pos = position(c, now);
  if (!pos || st.length < 2) return null;
  if (pos.kind === "before") return depRtMs(c) - now.getTime() <= 10 * 60000 && st[0].coord ? { p: st[0].coord, before: true } : null;
  if (pos.kind === "at") return st[pos.i].coord ? { p: st[pos.i].coord, before: false } : null;
  if (pos.kind === "between") {
    const a = st[pos.i].coord, b = st[pos.i + 1]?.coord;
    return a && b ? { p: [a[0] + (b[0] - a[0]) * pos.frac, a[1] + (b[1] - a[1]) * pos.frac], before: false } : null;
  }
  return null;
}
function detectTrain(now = new Date()) {
  suggestion = null;
  if (!geoOn || !detectOn || !geo?.me || geo.acc > 1000 || Date.now() - geo.at > 5 * 60000) return;
  let best = null;
  for (const c of current) {
    if (arrived(c, now)) continue;
    const tp = trainPoint(c, now);
    if (!tp) continue;
    const d = kmBetween(geo.me, tp.p);
    const limit = tp.before ? 0.5 + geo.acc / 1000 : 2 + geo.acc / 1000;
    if (d > limit) continue;
    // nearest first; at a station, the first train to leave
    if (!best || d < best.d - 0.2 || (Math.abs(d - best.d) <= 0.2 && depRtMs(c) < depRtMs(best.c))) best = { c, d, before: tp.before };
  }
  if (best && best.c.key !== pinnedKey && !detectNo.includes(best.c.key)) suggestion = { key: best.c.key, before: best.before };
}
function paintDetect() {
  detectTrain();
  const el = $("detect"), c = suggestion && current.find(x => x.key === suggestion.key);
  if (!c) { el.hidden = true; el.innerHTML = ""; return; }
  const x = (c.legs?.[0]?.label || c.products[0] || "").trim(), when = hhmm(new Date(c.dep));
  el.hidden = false;
  el.innerHTML = `<span class="dtxt">🚆 ${esc(t(suggestion.before ? "detectAskBefore" : "detectAsk", { x, t: when }))}</span>
    <button type="button" class="yes" data-detect="yes">${esc(t("detectYes"))}</button>
    <button type="button" data-detect="no">${esc(t("detectNo"))}</button>`;
}
$("detect").onclick = e => {
  const b = e.target.closest("button[data-detect]"); if (!b || !suggestion) return;
  if (b.dataset.detect === "yes") { pinnedKey = suggestion.key; save("cff.pinned", pinnedKey); }
  else { detectNo = [...detectNo, suggestion.key].slice(-30); save("cff.detectNo", detectNo); }
  suggestion = null; render(); maybeNotify();
};
function paintDetectSetting() {
  $("sDetect").checked = detectOn && geoOn; $("sDetect").disabled = !geoOn;
  $("detectRow").classList.toggle("off", !geoOn);
  $("hDetect").textContent = t(geoOn ? "h_trainDetect" : "detectNeedGeo");
}
$("sDetect").onchange = () => { detectOn = $("sDetect").checked; save("cff.trainDetect", detectOn); if (detectOn) checkGeo(true); render(); };
// while the app is open, check the location every 2 minutes (only when it is used)
setInterval(() => { if (geoOn && document.visibilityState === "visible") checkGeo(); }, 2 * 60000 + 5000);

// --- settings panel ------------------------------------------------------------------
// Opening it adds a step to the browser history, so the back button (Android, iPhone swipe) closes
// it instead of leaving the page.
function openSettings() {
  if (!$("settingsPanel").hidden) return;
  $("spBack").hidden = false; $("settingsPanel").hidden = false;
  document.body.classList.add("sp-lock");
  requestAnimationFrame(() => $("settingsPanel").classList.add("open"));
  try { history.pushState({ settings: true }, "", location.href); } catch {}
  setTimeout(() => $("spClose").focus(), 50);
}
function hideSettings() {
  if ($("settingsPanel").hidden) return;
  $("settingsPanel").classList.remove("open");
  document.body.classList.remove("sp-lock");
  $("spBack").hidden = true;
  setTimeout(() => { $("settingsPanel").hidden = true; }, 230);
  $("settingsBtn").focus();
}
function closeSettings() {
  if (history.state?.settings) history.back(); // the popstate below hides it
  else hideSettings();
}
// going back restores the previous address: put the current settings back in it
window.addEventListener("popstate", () => { if (!history.state?.settings) { hideSettings(); updateUrl(); } });
$("settingsBtn").onclick = openSettings;
$("spClose").onclick = closeSettings;
$("spBack").onclick = closeSettings;
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("settingsPanel").hidden && $("quip").hidden
      && !document.querySelector(".suggest:not([hidden])")) closeSettings();
});

applyLang();
updateUrl();
checkGeo(true);

// --- installable app (PWA) --------------------------------------------------------
// Works online (https) and on localhost. Edge / Chrome then offer to install the page as an app;
// the "Install the app" button appears when the browser allows it.
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
var installPrompt = null; // var + function: applyLang() above may call paintInstallBtn() before this line runs
function paintInstallBtn() {
  $("installBtn").hidden = !installPrompt;
  $("installBtn").textContent = t("installApp");
  $("installBtn").title = t("installTitle");
}
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installPrompt = e; paintInstallBtn(); });
window.addEventListener("appinstalled", () => { installPrompt = null; paintInstallBtn(); });
$("installBtn").onclick = async () => {
  if (!installPrompt) return;
  installPrompt.prompt();
  try { await installPrompt.userChoice; } catch {}
  installPrompt = null; paintInstallBtn();
};
refresh();
